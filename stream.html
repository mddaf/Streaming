<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Stream - beIN Sports HD 1 | StreamPulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <style>
    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      overflow-y: auto;
      height: 100vh;
    }
    .stream-page-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 8px 16px;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 20px;
      transition: var(--transition-fast);
    }
    .back-btn:hover {
      background: var(--bg-card);
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }
    .stream-shell {
      position: relative;
      background: #000;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }
    .stream-shell iframe {
      display: block;
      width: 100%;
      height: 600px;
      border: none;
    }
    @media (max-width: 768px) {
      .stream-shell iframe {
        height: 280px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <a href="index.html" class="nav-brand">
      <div class="brand-icon-wrapper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </div>
      <div>
        <span class="brand-text">StreamPulse</span>
        <span class="brand-tag">SPORTS</span>
      </div>
    </a>

    <div style="display:flex;align-items:center;gap:12px;">
      <a href="index.html" class="action-btn" style="text-decoration:none;">
        <span>← All Channels</span>
      </a>
      <div class="stream-status-pill">
        <span class="live-pulse-dot"></span> Live Broadcast
      </div>
    </div>
  </header>

  <main class="stream-page-container">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="badge-pill badge-category">Sports Arena</span>
        <h1 style="font-family:var(--font-heading);font-size:1.6rem;font-weight:700;">beIN Sports HD 1</h1>
      </div>
      <div style="font-size:0.82rem;color:var(--text-muted);font-family:var(--font-mono);" id="clockDisplay">
        UTC Live Time
      </div>
    </div>

    <div class="stream-shell" id="playerShell">
      <iframe
        id="streamFrame"
        src="https://1.kooralive360.com/albaplayer/bein-sports-hd-1/?serv=0"
        allowfullscreen
        scrolling="no"
        allow="autoplay; fullscreen; encrypted-media"
      ></iframe>

      <div class="player-action-bar">
        <div class="action-btn-group">
          <!-- Reload -->
          <button class="action-btn" onclick="reloadStream()" title="Reload Stream">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
            Reload
          </button>

          <!-- Server selection -->
          <select class="action-select" onchange="changeServer(this.value)" title="Stream Server">
            <option value="0">Auto / HD (Server 1)</option>
            <option value="1">Server 2 (Backup)</option>
            <option value="2">Server 3 (Low Latency)</option>
          </select>
        </div>

        <div class="action-btn-group">
          <!-- Fullscreen -->
          <button class="action-btn" onclick="goFullscreen()" title="Fullscreen">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
            Fullscreen
          </button>

          <!-- Pop-out -->
          <button class="action-btn" onclick="popOut()" title="Pop out player">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            Pop-out
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const frame = document.getElementById('streamFrame');
    const shell = document.getElementById('playerShell');

    function reloadStream() {
      const src = frame.src;
      frame.src = '';
      setTimeout(() => frame.src = src, 200);
    }

    function changeServer(serv) {
      const base = 'https://1.kooralive360.com/albaplayer/bein-sports-hd-1/?serv=';
      frame.src = base + serv;
    }

    function goFullscreen() {
      if (shell.requestFullscreen) shell.requestFullscreen();
      else if (shell.webkitRequestFullscreen) shell.webkitRequestFullscreen();
    }

    function popOut() {
      window.open(frame.src, '_blank', 'width=1280,height=720,toolbar=0,menubar=0');
    }

    // Live clock
    function tick() {
      const now = new Date();
      document.getElementById('clockDisplay').textContent =
        now.toUTCString().replace('GMT', 'UTC').slice(0, -4);
    }
    tick(); setInterval(tick, 1000);
  </script>
</body>
</html>
